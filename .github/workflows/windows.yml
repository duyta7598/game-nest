name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.build-tools/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: native/bin
          key: windows-native-release-v1-${{ hashFiles('native/engine.cpp', 'native/CMakeLists.txt', 'native/vcpkg.json', 'native/triplets/*.cmake', 'scripts/build-native.mjs') }}
      - uses: actions/cache/restore@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: vcpkg-cache
        with:
          path: .build-tools/vcpkg-cache
          key: windows-vcpkg-release-v1-${{ hashFiles('native/vcpkg.json', 'native/triplets/*.cmake') }}
      - uses: actions/checkout@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          repository: microsoft/vcpkg
          ref: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
          path: .build-tools/vcpkg
      - name: Bootstrap native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-tools/vcpkg-cache | Out-Null
          & .build-tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.build-tools/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - run: npm run native:build
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: native/bin
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: .build-tools/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - run: npm run native:test
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: GameNest-native-Windows-x64
          path: native/bin
          if-no-files-found: error
          retention-days: 7
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: GameNest-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
